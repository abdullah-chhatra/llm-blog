site_name: LLM Learning Blog
site_url: https://abdullah-chhatra.github.io/llm-blog/
site_author: Abdullah Chhatra

theme:
  name: material

nav:
  - Home: index.md
  - Perceptron: perceptron.md

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abdullah-chhatra


